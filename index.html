<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff9fbd" />
  <title>LA2026</title>
  <style>
    :root{
      --pink-1:#fff7fb;
      --pink-2:#ffe7f1;
      --pink-3:#ffc9dc;
      --pink-4:#ff9fbd;
      --pink-5:#f06f9f;
      --berry:#8e3f67;
      --ink:#5d4052;
      --white:#ffffff;
      --shadow:0 18px 50px rgba(210, 93, 143, .16);
      --radius:26px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.95) 0 7%, transparent 8%),
        radial-gradient(circle at 90% 0%, rgba(255,205,226,.7) 0 14%, transparent 15%),
        linear-gradient(135deg,#fff9fc 0%,#ffeaf3 48%,#fff7fb 100%);
      min-height:100vh;
    }
    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background-image:
        radial-gradient(circle, rgba(240,111,159,.16) 1.5px, transparent 1.6px);
      background-size:28px 28px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 75%);
    }
    .wrap{width:min(1180px,92vw);margin:auto;padding:28px 0 72px}
    .hero{
      position:relative; overflow:hidden;
      padding:48px;
      border:1px solid rgba(255,255,255,.8);
      border-radius:34px;
      background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,230,241,.86));
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
    }
    .hero::after{
      content:"✦";
      position:absolute; right:34px; top:22px;
      font-size:110px; color:rgba(255,159,189,.14);
      transform:rotate(14deg);
    }
    .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink-5);font-weight:800}
    h1{margin:10px 0 8px;font-size:clamp(38px,7vw,78px);line-height:1;letter-spacing:-.04em;color:var(--berry)}
    .subtitle{margin:0;max-width:650px;font-size:17px;line-height:1.8;color:#7d6070}
    .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    button,.btn{
      border:0;cursor:pointer;border-radius:999px;padding:13px 18px;font-weight:800;font-size:14px;
      transition:.2s ease;display:inline-flex;align-items:center;gap:8px;
    }
    button:hover,.btn:hover{transform:translateY(-2px)}
    .primary{background:linear-gradient(135deg,var(--pink-4),var(--pink-5));color:white;box-shadow:0 10px 24px rgba(240,111,159,.28)}
    .soft{background:#fff;color:var(--berry);border:1px solid #f7c5d8}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:22px}
    .card{
      grid-column:span 6;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.9);
      border-radius:var(--radius);
      padding:24px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }
    .card.wide{grid-column:span 12}
    .card.small{grid-column:span 4}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .title{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:900;color:var(--berry)}
    .icon{
      width:42px;height:42px;border-radius:15px;display:grid;place-items:center;
      background:linear-gradient(145deg,#fff,#ffd8e7);
      box-shadow:inset 0 0 0 1px rgba(240,111,159,.14);
    }
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .field{background:var(--pink-1);border:1px solid #f9d6e4;border-radius:18px;padding:14px}
    .label{font-size:12px;font-weight:800;color:var(--pink-5);margin-bottom:8px;letter-spacing:.05em}
    [contenteditable="true"]{
      outline:none;min-height:24px;border-radius:9px;padding:3px 5px;transition:.18s;
    }
    [contenteditable="true"]:focus{background:#fff;box-shadow:0 0 0 3px rgba(255,159,189,.2)}
    [contenteditable="true"]:empty::before{content:attr(data-placeholder);color:#bea4b1}
    .list{display:grid;gap:10px}
    .line{
      display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start;
      padding:11px 12px;border-radius:16px;background:var(--pink-1);border:1px dashed #f4bfd4
    }
    .dot{width:22px;height:22px;border-radius:8px;background:#ffd4e4;display:grid;place-items:center;font-size:12px}
    .day{
      border-radius:22px;padding:18px;background:linear-gradient(180deg,#fffafd,#fff1f7);
      border:1px solid #f8cede;margin-top:14px;
    }
    .day-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .day-name{font-weight:900;color:var(--berry);font-size:18px}
    .remove{background:transparent;color:#c77a99;padding:6px 10px}
    .timeline{display:grid;gap:10px}
    .time-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start}
    .time-pill{background:#ffd7e6;color:#a85379;border-radius:999px;padding:9px 10px;text-align:center;font-size:12px;font-weight:900}
    .editable-box{min-height:42px;background:white;border:1px solid #f3d6e1;border-radius:14px;padding:10px}
    .footer{text-align:center;margin-top:28px;color:#aa7f92;font-size:13px}
    .toast{
      position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
      opacity:0;pointer-events:none;background:#6f4058;color:#fff;padding:12px 18px;border-radius:999px;
      transition:.25s;box-shadow:0 14px 30px rgba(70,34,51,.2);z-index:20;font-weight:800
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:820px){
      .hero{padding:32px 24px}
      .card,.card.small{grid-column:span 12}
      .field-grid{grid-template-columns:1fr}
      .time-row{grid-template-columns:64px 1fr}
    }
    @media print{
      .toolbar,.remove,.add-day{display:none!important}
      body{background:white}
      .wrap{width:100%;padding:0}
      .hero,.card{box-shadow:none;break-inside:avoid}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Dream • Plan • Explore</div>
      <h1 contenteditable="true" data-placeholder="旅行标题"></h1>

      <div class="toolbar">

        <button class="soft" onclick="addDay()">＋ 添加一天</button>
        <button class="soft" onclick="window.print()">🖨️ 打印 / 保存 PDF</button>
        <button class="soft" onclick="clearAll()">↺ 清空内容</button>
      </div>

        </div>

          <div class="field"><div class="label">同行人员</div><div contenteditable="true" data-placeholder="点击填写"></div></div>
          <div class="field"><div class="label">预算</div><div contenteditable="true" data-placeholder="点击填写"></div></div>
        </div>
      </article>

      <article class="card">
        <div class="section-head"><div class="title"><span class="icon">🧳</span>行前准备</div></div>
        <div class="list">
          <div class="line"><span class="dot">✓</span><div contenteditable="true" data-placeholder="准备事项"></div></div>
          <div class="line"><span class="dot">✓</span><div contenteditable="true" data-placeholder="准备事项"></div></div>
          <div class="line"><span class="dot">✓</span><div contenteditable="true" data-placeholder="准备事项"></div></div>
          <div class="line"><span class="dot">✓</span><div contenteditable="true" data-placeholder="准备事项"></div></div>
        </div>
      </article>

      <article class="card">
        <div class="section-head"><div class="title"><span class="icon">🏨</span>住宿与交通</div></div>
        <div class="list">
          <div class="line"><span class="dot">🏡</span><div contenteditable="true" data-placeholder="住宿信息"></div></div>
          <div class="line"><span class="dot">✈️</span><div contenteditable="true" data-placeholder="航班 / 车票信息"></div></div>
          <div class="line"><span class="dot">🚓</span><div contenteditable="true" data-placeholder="当地交通"></div></div>
        </div>
      </article>

      <article class="card wide">
        <div class="section-head">
          <div class="title"><span class="icon">🌷</span>每日行程</div>
          <button class="soft add-day" onclick="addDay()">＋ 添加一天</button>
        </div>
        <div id="days"></div>
      </article>

      <article class="card small">
        <div class="section-head"><div class="title"><span class="icon">🍰</span>美食清单</div></div>
        <div class="list">
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
          <div class="line"><span class="dot">♡</span><div contenteditable="true" data-placeholder="餐厅 / 甜品"></div></div>
        </div>
      </article>

      <article class="card small">
        <div class="section-head"><div class="title"><span class="icon">📸</span>打卡地点</div></div>
        <div class="list">
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
          <div class="line"><span class="dot">✦</span><div contenteditable="true" data-placeholder="景点 / 拍照地点"></div></div>
        </div>
      </article>

      <article class="card small">
        <div class="section-head"><div class="title"><span class="icon">🛍️</span>购物清单</div></div>
        <div class="list">
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>
          <div class="line"><span class="dot">＋</span><div contenteditable="true" data-placeholder="想买的东西"></div></div>

      <article class="card wide">
        <div class="section-head"><div class="title"><span class="icon">💗</span>备注与回忆</div></div>
        <div class="editable-box" style="min-height:130px" contenteditable="true" data-placeholder="写下提醒、心情、照片说明或旅行回忆"></div>
      </article>
    </section>

    <div class="footer">Made by 白皮鸡 ♡</div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const dayTemplate = (n) => `
      <div class="day">
        <div class="day-top">
          <div class="day-name" contenteditable="true" data-placeholder="Day ${n}">Day ${n}</div>
          <button class="remove" onclick="this.closest('.day').remove(); saveLocal()">删除</button>
        </div>
        <div class="timeline">
          <div class="time-row"><div class="time-pill">上午</div><div class="editable-box" contenteditable="true" data-placeholder="点击填写行程"></div></div>
          <div class="time-row"><div class="time-pill">下午</div><div class="editable-box" contenteditable="true" data-placeholder="点击填写行程"></div></div>
          <div class="time-row"><div class="time-pill">晚上</div><div class="editable-box" contenteditable="true" data-placeholder="点击填写行程"></div></div>
        </div>
      </div>`;

    function addDay(){
      const days = document.querySelectorAll('.day').length + 1;
      document.getElementById('days').insertAdjacentHTML('beforeend', dayTemplate(days));
      saveLocal();
    }

    function serialize(){
      const clone = document.querySelector('main').cloneNode(true);
      clone.querySelectorAll('.toolbar,.remove,.add-day').forEach(el => el.remove());
      const editables = [...document.querySelectorAll('[contenteditable="true"]')];
      const values = editables.map(el => el.innerHTML);
      return { html: document.getElementById('days').innerHTML, values };
    }

    function restore(data){
      if(!data) return;
      if(data.html) document.getElementById('days').innerHTML = data.html;
      const editables = [...document.querySelectorAll('[contenteditable="true"]')];
      (data.values || []).forEach((v,i)=>{ if(editables[i]) editables[i].innerHTML = v; });
    }

    function encodeData(data){
      return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }
    function decodeData(str){
      return JSON.parse(decodeURIComponent(escape(atob(str))));
    }

    async function sharePage(){
      saveLocal();
      const encoded = encodeData(serialize());
      const url = location.href.split('#')[0] + '#data=' + encoded;
      try{
        await navigator.clipboard.writeText(url);
        showToast('分享链接已复制 ♡');
      }catch(e){
        prompt('复制这个分享链接：', url);
      }
    }

    function saveLocal(){
      localStorage.setItem('LA2026', JSON.stringify(serialize()));
    }

    function clearAll(){
      if(!confirm('确定要清空所有内容吗？')) return;
      localStorage.removeItem('LA2026');
      location.hash = '';
      location.reload();
    }

    function showToast(text){
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),1800);
    }

    document.addEventListener('input', ()=>saveLocal());

    window.addEventListener('DOMContentLoaded', ()=>{
      const hash = location.hash;
      if(hash.startsWith('#data=')){
        try{
          restore(decodeData(hash.slice(6)));
          showToast('已载入分享内容');
        }catch(e){
          console.warn(e);
          addDay();
        }
      }else{
        const saved = localStorage.getItem('LA2026');
        if(saved){
          try{ restore(JSON.parse(saved)); }catch(e){ addDay(); }
        }else{
          addDay();
          addDay();
          addDay();
        }
      }
    });
  </script>
</body>
</html>
